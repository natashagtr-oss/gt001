<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>GT-001 · Roteiro</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2333; --line:#2b3444;
  --txt:#e9eef6; --dim:#8b98ad; --accent:#3fb6ff; --accent2:#1c7ed6;
  --gold:#ffd166; --err:#e5484d;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior:none;user-select:none;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-size:17px;font-weight:800}
.brand small{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1.2px}
.spacer{flex:1}

/* ---- painel gigante: o que importa no palco ---- */
#now{flex:0 0 auto;padding:18px 16px;background:linear-gradient(180deg,#16283f,#0d1117);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}
#nowNum{font-size:64px;font-weight:900;color:#0d1117;background:var(--gold);
  padding:6px 20px;border-radius:16px;line-height:1.05;letter-spacing:-1px;min-width:190px;text-align:center}
#nowName{font-size:27px;font-weight:800;line-height:1.15}
#nowSub{font-size:15px;color:var(--dim);margin-top:5px;font-weight:700}

nav{flex:0 0 auto;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:15px 8px;font-size:14px;font-weight:800;color:var(--dim);
  border-bottom:3px solid transparent;letter-spacing:.4px}
nav button.sel{color:var(--txt);border-bottom-color:var(--accent)}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.hide{display:none!important}

.songrow{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.songrow:active{background:var(--panel2)}
.songrow .t{font-size:21px;font-weight:800}
.songrow .s{font-size:13px;color:var(--dim);margin-top:4px;font-weight:600}
.chev{margin-left:auto;color:var(--dim);font-size:26px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pbtn{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;
  text-align:left;min-height:108px;display:flex;align-items:center;gap:14px}
.pbtn:active{background:var(--panel2)}
.pnum{font-size:26px;font-weight:900;color:var(--accent);flex:0 0 auto;min-width:74px}
.pbtn .lbl{font-size:19px;font-weight:800;line-height:1.2}
.pbtn .pn{font-size:13px;color:var(--dim);margin-top:5px;font-weight:700}
.pbtn.active{border-color:var(--gold);background:#2a2413}
.pbtn.active .pnum{color:var(--gold)}

.sechead{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.sechead h2{margin:0;font-size:23px;font-weight:900;flex:1}
.btn{padding:12px 16px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);font-weight:800;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent2);border-color:var(--accent2)}
.btn.danger{background:#3a1d20;border-color:#5b2b2f;color:#ffb3b6}

#nextWrap{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
#nextBtn{width:100%;padding:24px;border-radius:20px;background:var(--accent2);
  font-size:24px;font-weight:900;letter-spacing:.5px}
#nextBtn:active{filter:brightness(.9)}
#nextBtn small{display:block;font-size:14px;font-weight:700;opacity:.85;margin-top:5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--dim);font-weight:700;margin:0 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);font-size:17px;font-family:inherit}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.row>*{min-width:0}
.grow{flex:1}
.tiny{padding:12px 14px;font-size:16px;font-weight:800;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.banner{padding:13px 15px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:14px;line-height:1.5}
.banner.info{background:#12263a;border:1px solid #1d3c5c;color:#bfe0ff}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--err)}
.dot.on{background:#31c07a}
#midibar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--panel2);border-bottom:1px solid var(--line)}
#midibar .mlabel{font-size:12px;color:var(--dim);font-weight:800;letter-spacing:.5px}
#midibar select{flex:1;padding:10px;font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;
  background:#fff;color:#111;padding:15px 26px;border-radius:999px;font-weight:800;font-size:17px;
  opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand">ROTEIRO GT-001<small>BOSS · WORSHIP</small></div>
  <div class="spacer"></div>
  <span class="pill"><span class="dot" id="midiDot"></span><span id="midiTxt">MIDI off</span></span>
  <button class="btn primary" id="btnMidi">Conectar</button>
</header>

<div id="now">
  <div id="nowNum">--</div>
  <div>
    <div id="nowName">Escolha uma música</div>
    <div id="nowSub">O número grande é o patch que você gira na pedaleira</div>
  </div>
</div>

<div id="midibar" class="hide">
  <span class="mlabel">Porta MIDI</span>
  <select id="outSel"></select>
  <button class="btn" id="btnTest">Testar</button>
  <button class="btn" id="btnRescan">↻</button>
</div>

<nav>
  <button data-tab="set" class="sel">MÚSICAS</button>
  <button data-tab="all">TODOS</button>
  <button data-tab="edit">EDITAR</button>
</nav>

<main>
  <section id="tab-set"><div id="songList"></div></section>

  <section id="tab-song" class="hide">
    <div class="sechead">
      <button class="btn" id="backSet">‹ Voltar</button>
      <h2 id="songTitle"></h2>
    </div>
    <div class="grid" id="songPatches"></div>
    <div id="nextWrap">
      <button id="nextBtn">PRÓXIMO ▶<small id="nextHint"></small></button>
    </div>
  </section>

  <section id="tab-all" class="hide">
    <div class="row"><input id="search" placeholder="Buscar patch..." autocomplete="off"></div>
    <div class="grid" id="allPatches"></div>
  </section>

  <section id="tab-edit" class="hide">
    <div class="banner info">Monte o culto aqui. Tudo fica salvo no tablet, mesmo fechando o app.</div>
    <div class="card">
      <label>Nova música</label>
      <div class="row">
        <input id="newSong" class="grow" placeholder="Nome da música" autocomplete="off">
        <button class="btn primary" id="addSong">Criar</button>
      </div>
    </div>
    <div id="editList"></div>
    <button class="btn danger" id="resetAll" style="width:100%;padding:16px;margin-top:8px">Restaurar roteiro original</button>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";

var PATCHES = [
{n:1,nome:"WSHP ALL IN 1"},{n:2,nome:"JM DELAY"},{n:3,nome:"JM SOLO"},{n:4,nome:"RODRIGO SOLO"},
{n:5,nome:"CLEAN WSHP"},{n:6,nome:"1 EST WSHP"},{n:7,nome:"2 EST WSHP"},{n:8,nome:"LEAD WSHP"},
{n:9,nome:"DIRTY PP ROCK"},{n:10,nome:"2 EST PP ROCK"},{n:11,nome:"LEAD 1 PP ROCK"},{n:12,nome:"LEAD 2 PP ROCK"},
{n:13,nome:"CLEAN BALADA"},{n:14,nome:"1 EST BALADA"},{n:15,nome:"2 EST BALADA"},{n:16,nome:"LEAD BALADA"},
{n:17,nome:"CLEAN BLACK"},{n:18,nome:"1 EST BLACK"},{n:19,nome:"2 EST BLACK"},{n:20,nome:"LEAD BLACK"},
{n:21,nome:"COMBO CRUNCH"},{n:22,nome:"TOUCH & GO"},{n:23,nome:"CRUNCH LEAD"},{n:24,nome:"WORSHIP CLEAN"},
{n:25,nome:"WORSHIP DRIVE"},{n:26,nome:"WORSHIP LEAD"},{n:27,nome:"GRATO AMOR"},{n:28,nome:"TODO SOM RESGATE"},
{n:29,nome:"TU ES DEUS"},{n:30,nome:"CLEAN AMBIENT"},{n:31,nome:"CRUNCH WSHP"},{n:32,nome:"DRIVE RITMO"},
{n:33,nome:"LEAD SOLO"},{n:34,nome:"AMBIENT PAD"},{n:35,nome:"HOSANNA VERSO"},{n:36,nome:"HOSANNA REFRAO"},
{n:37,nome:"JM AMBIENT WSHP"},{n:38,nome:"DUDA CLEAN"},{n:39,nome:"DUDA AMBI"},{n:40,nome:"DUDA BASE"},
{n:41,nome:"DUDA SOLO"},{n:42,nome:"CACAU GROOVE"},{n:43,nome:"AFRAM BASE"},{n:44,nome:"AFRAM SOLO"},
{n:45,nome:"DELEO WSHP"},{n:46,nome:"CBJR CLEAN"},{n:47,nome:"CBJR BASE"},{n:48,nome:"CBJR LEAD"},
{n:49,nome:"ASATO LEAD"},{n:50,nome:"SATRIANI LEAD"},{n:51,nome:"LARI BASILIO"},{n:52,nome:"OZIEL LEAD"},
{n:53,nome:"ROGER FRANCO"},{n:54,nome:"CACAU WSHP"},{n:55,nome:"AH JESUS DELEO"},{n:56,nome:"TU ES / AGUAS PROF"},
{n:57,nome:"REGGAE CLEAN"},{n:58,nome:"GRACAS DOU"},{n:59,nome:"FILHO D VIVO"},{n:60,nome:"AUTO WAH FUNK"},
{n:61,nome:"ERIC BASE"},{n:62,nome:"ERIC SOLO"}
];

var PADRAO = [
 {t:"Hosanna — Hillsong",        p:[{l:"Intro / Verso",n:35},{l:"Refrão",n:36},{l:"Ambiente",n:34},{l:"Solo",n:33}]},
 {t:"Grato por Seu Amor — Get",  p:[{l:"Música toda",n:27},{l:"Refrão + drive",n:32},{l:"Ambiente",n:37}]},
 {t:"Tu És Deus (A Ele)",        p:[{l:"Música toda",n:29},{l:"Refrão + drive",n:32},{l:"Solo",n:33}]},
 {t:"Filho do Deus Vivo — Nívea",p:[{l:"Música toda",n:59},{l:"Crescendo",n:31},{l:"Refrão + drive",n:32}]},
 {t:"Graças Dou",                p:[{l:"Música toda",n:58},{l:"Refrão",n:31},{l:"Ambiente",n:34}]},
 {t:"Ah, Jesus — Dêleo",         p:[{l:"Música toda",n:55},{l:"Refrão",n:31},{l:"Solo",n:33}]},
 {t:"Tu És / Águas Profundas",   p:[{l:"Música toda",n:56},{l:"Refrão",n:31},{l:"Ambiente",n:34}]},
 {t:"Todo Som — Resgate",        p:[{l:"Base",n:28},{l:"Lead",n:48},{l:"Clean",n:46}]},
 {t:"Reggae",                    p:[{l:"Base reggae",n:57},{l:"Groove",n:42},{l:"Solo",n:33}]},
 {t:"BLOCOS — uso geral",        p:[{l:"Limpo ambiente",n:30},{l:"Crunch",n:31},{l:"Base drive",n:32},{l:"Solo",n:33},
                                    {l:"Pad",n:34},{l:"Ambiência JM",n:37},{l:"Groove",n:42},{l:"Wah",n:60}]},
 {t:"ARTISTAS",                  p:[{l:"Duda clean",n:38},{l:"Duda base",n:40},{l:"Duda solo",n:41},{l:"Afram base",n:43},
                                    {l:"Afram solo",n:44},{l:"Asato",n:49},{l:"Satriani",n:50},{l:"Lari",n:51},
                                    {l:"Oziel",n:52},{l:"Eric base",n:61},{l:"Eric solo",n:62}]}
];

var KEY="gt001.setlist.v1";
var songs=load(), midi=null, out=null, openSong=-1, curIdx=-1, curPatch=0;

function load(){
  try{var r=localStorage.getItem(KEY); if(r){var p=JSON.parse(r); if(p&&p.length) return p;}}catch(e){}
  return JSON.parse(JSON.stringify(PADRAO));
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(songs));}catch(e){toast("Não consegui salvar");} }
function nome(n){for(var i=0;i<PATCHES.length;i++) if(PATCHES[i].n===n) return PATCHES[i].nome; return "?";}
function uu(n){return "U"+String(n).padStart(3,"0");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},1700);}

/* O GT-001 expõe DUAS portas USB MIDI internas. Se a mensagem for para a
   porta errada, o aparelho aparece na lista mas nada acontece — por isso
   a porta é escolhida na tela, e não adivinhada. */
var OUTKEY="gt001.midiout";
function listOuts(){
  var l=[]; if(midi) midi.outputs.forEach(function(o){l.push(o);}); return l;
}
function fillOuts(){
  var l=listOuts(), sel=document.getElementById("outSel"), saved=null;
  try{ saved=localStorage.getItem(OUTKEY); }catch(e){}
  var h="", escolhido=-1;
  for(var i=0;i<l.length;i++){
    h+='<option value="'+i+'">'+esc(l[i].name||("Porta "+(i+1)))+'</option>';
    if(saved && l[i].name===saved) escolhido=i;
  }
  if(escolhido<0){
    for(var j=0;j<l.length;j++){var nm=(l[j].name||"").toUpperCase();
      if(nm.indexOf("GT")>=0||nm.indexOf("BOSS")>=0||nm.indexOf("ROLAND")>=0){escolhido=j;break;}}
  }
  if(escolhido<0 && l.length) escolhido=0;
  sel.innerHTML=h;
  if(escolhido>=0){ sel.value=String(escolhido); out=l[escolhido]; } else { out=null; }
  document.getElementById("midibar").classList.toggle("hide", l.length===0);
  var d=document.getElementById("midiDot"), t=document.getElementById("midiTxt");
  d.className="dot"+(out?" on":"");
  t.textContent = l.length ? (l.length+" porta"+(l.length>1?"s":"")) : "Nada encontrado";
  document.getElementById("btnMidi").style.display = l.length ? "none" : "";
  paintNow();
}
function connectMidi(){
  if(window.isSecureContext===false){ toast("Abra pelo endereço https"); return; }
  if(!navigator.requestMIDIAccess){ toast("Use o Chrome"); return; }
  navigator.requestMIDIAccess({sysex:false}).then(function(a){
    midi=a;
    midi.onstatechange=function(){ fillOuts(); };
    fillOuts();
    toast(listOuts().length ? "Pedaleira encontrada" : "Nenhuma porta MIDI");
  }).catch(function(){ toast("Permissão de MIDI negada"); });
}
function enviar(n){
  curPatch=n; paintNow(); paintActive();
  if(!out) return;
  try{
    out.send([0xB0,0x00,n>100?1:0]);
    out.send([0xB0,0x20,0]);
    out.send([0xC0,(n>100?n-101:n-1)&0x7F]);
  }catch(e){ toast("Erro ao enviar"); }
}
function paintNow(){
  document.getElementById("nowNum").textContent = curPatch?uu(curPatch):"--";
  document.getElementById("nowName").textContent = curPatch?nome(curPatch):"Escolha uma música";
  var s = songs[openSong];
  document.getElementById("nowSub").textContent = !curPatch
    ? "O número grande é o patch que você gira na pedaleira"
    : (out ? "Enviado para a pedaleira"
           : (s && curIdx>=0 && s.p[curIdx] ? s.t+" · "+s.p[curIdx].l : "Gire o knob até esse número"));
}
function paintActive(){
  var b=document.querySelectorAll(".pbtn");
  for(var i=0;i<b.length;i++) b[i].classList.toggle("active",+b[i].dataset.n===curPatch);
}
function show(t){
  ["set","song","all","edit"].forEach(function(k){
    document.getElementById("tab-"+k).classList.toggle("hide",k!==t);});
  var nb=document.querySelectorAll("nav button");
  for(var i=0;i<nb.length;i++){var d=nb[i].dataset.tab;
    nb[i].classList.toggle("sel",d===t||(t==="song"&&d==="set"));}
}
function drawSongs(){
  var h="";
  songs.forEach(function(s,i){
    h+='<button class="songrow" data-i="'+i+'"><div><div class="t">'+esc(s.t)+'</div>'+
       '<div class="s">'+s.p.length+' timbre'+(s.p.length===1?"":"s")+'</div></div><div class="chev">›</div></button>';
  });
  document.getElementById("songList").innerHTML=h||'<div class="banner info">Nenhuma música. Vá em EDITAR.</div>';
}
function drawSong(i){
  openSong=i; curIdx=-1; var s=songs[i]; if(!s) return show("set");
  document.getElementById("songTitle").textContent=s.t;
  var h="";
  s.p.forEach(function(x,j){
    h+='<button class="pbtn" data-n="'+x.n+'" data-j="'+j+'"><div class="pnum">'+uu(x.n)+'</div>'+
       '<div><div class="lbl">'+esc(x.l)+'</div><div class="pn">'+esc(nome(x.n))+'</div></div></button>';
  });
  document.getElementById("songPatches").innerHTML=h||'<div class="banner info">Sem timbres. Adicione em EDITAR.</div>';
  document.getElementById("nextWrap").style.display = s.p.length>1 ? "" : "none";
  hint(); show("song"); paintActive();
}
function hint(){
  var s=songs[openSong]; if(!s||!s.p.length) return;
  var j=(curIdx+1)%s.p.length;
  document.getElementById("nextHint").textContent = s.p[j].l+" · "+uu(s.p[j].n);
}
function drawAll(f){
  f=(f||"").toLowerCase(); var h="";
  PATCHES.forEach(function(p){
    if(f && (uu(p.n)+" "+p.nome).toLowerCase().indexOf(f)<0) return;
    h+='<button class="pbtn" data-n="'+p.n+'"><div class="pnum">'+uu(p.n)+'</div>'+
       '<div><div class="lbl">'+esc(p.nome)+'</div></div></button>';
  });
  document.getElementById("allPatches").innerHTML=h||'<div class="banner info">Nada encontrado.</div>';
  paintActive();
}
function opts(sel){var h="";PATCHES.forEach(function(p){
  h+='<option value="'+p.n+'"'+(p.n===sel?" selected":"")+'>'+uu(p.n)+" · "+esc(p.nome)+'</option>';});return h;}
function drawEdit(){
  var h="";
  songs.forEach(function(s,i){
    h+='<div class="card"><div class="row">'+
       '<input class="grow" data-ren="'+i+'" value="'+esc(s.t)+'">'+
       '<button class="tiny" data-up="'+i+'">↑</button><button class="tiny" data-dn="'+i+'">↓</button>'+
       '<button class="tiny" data-delS="'+i+'" style="color:#ffb3b6">✕</button></div>';
    s.p.forEach(function(x,j){
      h+='<div class="row"><input class="grow" data-lbl="'+i+'.'+j+'" value="'+esc(x.l)+'" placeholder="Parte da música">'+
         '<select data-pat="'+i+'.'+j+'" class="grow">'+opts(x.n)+'</select>'+
         '<button class="tiny" data-delP="'+i+'.'+j+'" style="color:#ffb3b6">✕</button></div>';
    });
    h+='<button class="btn" data-addP="'+i+'" style="width:100%;margin-top:6px">+ Adicionar timbre</button></div>';
  });
  document.getElementById("editList").innerHTML=h;
}

document.querySelector("nav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  var t=b.dataset.tab; show(t);
  if(t==="set") drawSongs(); if(t==="all") drawAll(document.getElementById("search").value); if(t==="edit") drawEdit();
});
document.getElementById("backSet").onclick=function(){show("set");drawSongs();};
document.getElementById("songList").addEventListener("click",function(e){
  var b=e.target.closest("[data-i]"); if(b) drawSong(+b.dataset.i);});
document.querySelector("main").addEventListener("click",function(e){
  var b=e.target.closest(".pbtn"); if(!b) return;
  if(b.dataset.j!==undefined) curIdx=+b.dataset.j;
  enviar(+b.dataset.n); hint();
});
document.getElementById("nextBtn").onclick=function(){
  var s=songs[openSong]; if(!s||!s.p.length) return;
  curIdx=(curIdx+1)%s.p.length; enviar(s.p[curIdx].n); hint();
};
document.getElementById("search").addEventListener("input",function(){drawAll(this.value);});
document.getElementById("addSong").onclick=function(){
  var i=document.getElementById("newSong"),v=i.value.trim();
  if(!v){toast("Escreva o nome");return;}
  songs.push({t:v,p:[]}); i.value=""; save(); drawEdit(); toast("Música criada");};
document.getElementById("resetAll").onclick=function(){
  if(!confirm("Voltar ao roteiro original? Suas mudanças serão apagadas.")) return;
  songs=JSON.parse(JSON.stringify(PADRAO)); save(); drawEdit(); toast("Restaurado");};
document.getElementById("editList").addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return; var d=t.dataset,k,i,m;
  if(d.up!==undefined){i=+d.up; if(i>0){m=songs.splice(i,1)[0];songs.splice(i-1,0,m);}}
  else if(d.dn!==undefined){i=+d.dn; if(i<songs.length-1){m=songs.splice(i,1)[0];songs.splice(i+1,0,m);}}
  else if(d.dels!==undefined){if(!confirm("Apagar esta música?"))return; songs.splice(+d.dels,1);}
  else if(d.delp!==undefined){k=d.delp.split(".");songs[+k[0]].p.splice(+k[1],1);}
  else if(d.addp!==undefined){songs[+d.addp].p.push({l:"Novo",n:30});}
  else return;
  save(); drawEdit();});
document.getElementById("editList").addEventListener("change",function(e){
  var d=e.target.dataset,k;
  if(d.ren!==undefined) songs[+d.ren].t=e.target.value;
  else if(d.lbl!==undefined){k=d.lbl.split(".");songs[+k[0]].p[+k[1]].l=e.target.value;}
  else if(d.pat!==undefined){k=d.pat.split(".");songs[+k[0]].p[+k[1]].n=+e.target.value;}
  else return;
  save();});

document.getElementById("btnMidi").onclick=connectMidi;
document.getElementById("btnRescan").onclick=function(){ fillOuts(); toast("Portas atualizadas"); };
document.getElementById("outSel").addEventListener("change",function(){
  var l=listOuts(), i=+this.value;
  out = l[i]||null;
  try{ if(out) localStorage.setItem(OUTKEY,out.name); }catch(e){}
  document.getElementById("midiDot").className="dot"+(out?" on":"");
  paintNow(); toast(out?("Usando: "+out.name):"Sem porta");
});
document.getElementById("btnTest").onclick=function(){
  var n=curPatch||30;
  enviar(n);
  toast(out ? ("Enviado "+uu(n)+" (PC "+(n-1)+")") : "Escolha uma porta");
};

drawSongs(); drawAll(""); paintNow(); connectMidi();
</script>
</body>
</html>
